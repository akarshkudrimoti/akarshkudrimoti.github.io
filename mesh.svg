<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="Inter,Arial,sans-serif">
<rect width="900" height="380" fill="#fff"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#16181d">Mesh Search: a query floods out, ranked results flow back</text>
<g stroke="#9aa3b2" stroke-width="2">
<line x1="150" y1="200" x2="320" y2="120"/><line x1="150" y1="200" x2="320" y2="290"/>
<line x1="320" y1="120" x2="510" y2="90"/><line x1="320" y1="120" x2="510" y2="210"/>
<line x1="320" y1="290" x2="510" y2="210"/><line x1="320" y1="290" x2="510" y2="320"/>
<line x1="510" y1="90" x2="700" y2="150" stroke-dasharray="6 6"/><line x1="510" y1="210" x2="700" y2="150"/><line x1="510" y1="320" x2="700" y2="280" stroke-dasharray="6 6"/>
</g>
<g font-size="13" fill="#fff" text-anchor="middle" font-weight="700">
<circle cx="150" cy="200" r="34" fill="#2f9e5b"/><text x="150" y="205">entry</text>
<circle cx="320" cy="120" r="26" fill="#14532d"/><text x="320" y="125">n1</text>
<circle cx="320" cy="290" r="26" fill="#14532d"/><text x="320" y="295">n2</text>
<circle cx="510" cy="90" r="26" fill="#14532d"/><text x="510" y="95">n3</text>
<circle cx="510" cy="210" r="26" fill="#14532d"/><text x="510" y="215">n4</text>
<circle cx="510" cy="320" r="26" fill="#14532d"/><text x="510" y="325">n5</text>
<circle cx="700" cy="150" r="26" fill="#14532d"/><text x="700" y="155">n6</text>
<circle cx="700" cy="280" r="26" fill="#14532d"/><text x="700" y="285">n7</text>
</g>
<g font-size="13" fill="#5b6170">
<text x="760" y="110">solid = Wi-Fi link</text><text x="760" y="132">dashed = BLE link</text>
<text x="760" y="170">Noise-encrypted</text><text x="760" y="192">TCP on every hop</text>
<text x="40" y="270">Entry node embeds the</text><text x="40" y="288">query once, then fuses</text><text x="40" y="306">replies with RRF</text>
</g>
</svg>
