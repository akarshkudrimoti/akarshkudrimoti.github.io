<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" font-family="Inter,Arial,sans-serif">
<rect width="900" height="240" fill="#fff"/>
<text x="30" y="38" font-size="20" font-weight="700" fill="#16181d">Crawfish: plan → apply → verify for AI agents</text>
<defs><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3b2"/></marker></defs>
<g font-size="15" text-anchor="middle" font-weight="700">
<rect x="40" y="85" width="180" height="80" rx="40" fill="#eaf4ed"/><text x="130" y="131" fill="#16181d">craw plan</text>
